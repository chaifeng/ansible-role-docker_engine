- block:
    - ansible.builtin.import_tasks: repository.yml
      tags: docker_repository

    - name: Explain deferred Docker package checks
      debug:
        msg: >-
          The Docker repository setup would change. Package installation checks are deferred
          until the repository and its package cache have been updated by a normal run.
      when: ansible_check_mode and docker_apt_repository.changed

    - name: Ensure Docker CE is installed
      apt:
        name: docker-ce
        state: present
        update_cache: yes
        cache_valid_time: 86400  # Cache valid for 1 day
        force_apt_get: yes
      when: not ansible_check_mode or not docker_apt_repository.changed

    - name: Ensure specific Docker CE version installed
      apt:
        name: "docker-ce={{ docker_version }}~*"
        state: present
        update_cache: yes
        cache_valid_time: 86400  # Cache valid for 1 day
        force_apt_get: yes
      when:
        - docker_version is defined
        - not ansible_check_mode or not docker_apt_repository.changed

    - name: Adding users to docker group
      user:
        name: "{{ item }}"
        append: yes
        groups: docker
      loop: "{{ docker_users }}"

  tags:
    - docker_install

- block:
    - name: Ensure pip and setuptools
      apt:
        name: "python3-pip,python3-setuptools"
        state: present

    - name: Ensure docker modules
      pip:
        name: "{{ item.key }}"
        version: "{{ item.value }}"
        state: present
      loop: "{{ lookup('dict', docker_pip_packages | default({})) }}"

  tags:
    - docker_dependencies
    - docker_install

- block:
    - name: Add docker systemd overwrite dir
      file:
        path: /etc/systemd/system/docker.service.d
        state: directory
      when: ansible_facts['service_mgr'] == "systemd"

    - name: Allow docker listen on TCP
      copy:
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/dockerd -H unix:///var/run/docker.sock -H tcp://{{ docker_listen_addr }}
        dest: /etc/systemd/system/docker.service.d/override.conf
      notify:
        - Reload Systemd
        - Restart Docker
      when: ansible_facts['service_mgr'] == "systemd" and docker_listen_addr is defined

    - name: Allow docker listen on TCP
      lineinfile:
        path: /etc/default/docker
        regexp: "^DOCKER_OPTS="
        line: "DOCKER_OPTS='-H unix:///var/run/docker.sock -H tcp://{{ docker_listen_addr }}'"
      notify: Restart Docker
      when: ansible_facts['service_mgr'] != "systemd" and docker_listen_addr is defined
  tags: docker_tcp

- meta: flush_handlers
